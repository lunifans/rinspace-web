name: Feature request
description: Propose a focused public-frontend improvement.
title: "[Feature]: "
labels: [enhancement, triage]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe the user need rather than only a proposed implementation.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome and acceptance criteria
    validations:
      required: true
  - type: textarea
    id: boundaries
    attributes:
      label: Demo, integration, and production considerations
      description: Identify any private backend, credential, or production-only dependency.
  - type: checkboxes
    id: conduct
    attributes:
      label: Confirmation
      options:
        - label: I agree to follow the Code of Conduct.
          required: true
