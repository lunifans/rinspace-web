name: Bug report
description: Report a reproducible, non-sensitive Rinspace Web problem.
title: "[Bug]: "
labels: [bug, triage]
body:
  - type: markdown
    attributes:
      value: Do not disclose vulnerabilities, credentials, personal data, or private service details here. Use the private security contact instead.
  - type: input
    id: version
    attributes:
      label: Version or full commit SHA
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Deployment mode
      options: [demo, integration, official, unknown]
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Reproduction and observed behavior
      description: Include minimal steps, expected behavior, and actual behavior.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Browser and deployment details
      description: Do not include secrets, private URLs, tokens, or personal data.
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Confirmation
      options:
        - label: I searched existing issues and removed sensitive information.
          required: true
