name: Developer Certificate of Origin

"on":
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: read
  pull-requests: read

jobs:
  dco:
    name: Verify DCO sign-offs for every commit author and coauthor
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout the trusted base commit only
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - name: Check commit messages through the read-only GitHub API
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/check-dco.mjs --event "$GITHUB_EVENT_PATH"
