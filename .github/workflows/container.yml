name: Container CI

"on":
  pull_request:
    paths:
      - ".github/workflows/container.yml"
      - "Dockerfile"
      - "compose*.yaml"
      - "config/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "public/**"
      - "scripts/**"
      - "src/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/container.yml"
      - "Dockerfile"
      - "compose*.yaml"
      - "config/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "public/**"
      - "scripts/**"
      - "src/**"
  workflow_dispatch:
    inputs:
      operation:
        description: Workflow operation
        required: true
        default: smoke
        type: choice
        options:
          - smoke
          - pull-published-image
      image_digest:
        description: Published rinspace-web sha256 digest to pull
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: container-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: ${{ matrix.architecture }} non-root smoke
    if: (github.event_name != 'workflow_dispatch' || inputs.operation == 'smoke') && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, linux, x64, rinspace-release-build]
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: amd64
            platform: linux/amd64
            port: 4380
          - architecture: arm64
            platform: linux/arm64
            port: 4381
    steps:
      - name: Checkout exact source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up pinned QEMU action
        uses: docker/setup-qemu-action@29109295f81e9208d7d86ff1c6c12d2833863392 # v3.6.0
        with:
          cache-image: false
      - name: Set up pinned Buildx action
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
        with:
          driver-opts: ${{ vars.RINSPACE_BUILDX_DRIVER_OPTS }}
      - name: Build exact platform image
        env:
          PLATFORM: ${{ matrix.platform }}
          IMAGE: rinspace-web:ci-${{ github.run_id }}-${{ matrix.architecture }}
        run: |
          build_time="$(git show -s --format=%cI "$GITHUB_SHA")"
          docker buildx build \
            --build-arg "RINSPACE_BUILD_COMMIT=$GITHUB_SHA" \
            --build-arg "RINSPACE_BUILD_TIME=$build_time" \
            --load \
            --platform "$PLATFORM" \
            --tag "$IMAGE" \
            .
          test "$(docker image inspect --format '{{.Architecture}}' "$IMAGE")" = "${{ matrix.architecture }}"
          test "$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "$IMAGE")" = "$GITHUB_SHA"
      - name: Validate root Compose, restart, health, and read-only runtime
        env:
          DOCKER_DEFAULT_PLATFORM: ${{ matrix.platform }}
          RINSPACE_SMOKE_COMMIT: ${{ github.sha }}
          RINSPACE_WEB_IMAGE: rinspace-web:ci-${{ github.run_id }}-${{ matrix.architecture }}
          RINSPACE_WEB_PORT: ${{ matrix.port }}
        run: |
          project="rinspace-web-root-${GITHUB_RUN_ID}-${{ matrix.architecture }}"
          docker compose --project-name "$project" --file compose.yaml config --quiet
          docker compose --project-name "$project" --file compose.yaml up --detach --no-build
          container="$(docker compose --project-name "$project" --file compose.yaml ps --quiet rinspace-web)"
          test -n "$container"
          test "$(docker inspect --format '{{.Config.User}}' "$container")" = "1000:1000"
          test "$(docker inspect --format '{{.HostConfig.ReadonlyRootfs}}' "$container")" = "true"
          if docker exec "$container" touch /opt/rinspace/core/write-probe; then exit 1; fi
          RINSPACE_SMOKE_ORIGIN="http://127.0.0.1:${RINSPACE_WEB_PORT}" RINSPACE_SMOKE_BASE_PATH=/ node scripts/smoke-container.mjs
          docker compose --project-name "$project" --file compose.yaml restart rinspace-web
          RINSPACE_SMOKE_ORIGIN="http://127.0.0.1:${RINSPACE_WEB_PORT}" RINSPACE_SMOKE_BASE_PATH=/ node scripts/smoke-container.mjs
      - name: Remove root service
        if: always()
        env:
          DOCKER_DEFAULT_PLATFORM: ${{ matrix.platform }}
          RINSPACE_WEB_IMAGE: rinspace-web:ci-${{ github.run_id }}-${{ matrix.architecture }}
          RINSPACE_WEB_PORT: ${{ matrix.port }}
        run: |
          project="rinspace-web-root-${GITHUB_RUN_ID}-${{ matrix.architecture }}"
          docker compose --project-name "$project" --file compose.yaml down --volumes --remove-orphans
      - name: Validate subpath Compose and direct refresh
        env:
          DOCKER_DEFAULT_PLATFORM: ${{ matrix.platform }}
          RINSPACE_SMOKE_COMMIT: ${{ github.sha }}
          RINSPACE_WEB_IMAGE: rinspace-web:ci-${{ github.run_id }}-${{ matrix.architecture }}
          RINSPACE_WEB_PORT: ${{ matrix.port }}
        run: |
          project="rinspace-web-subpath-${GITHUB_RUN_ID}-${{ matrix.architecture }}"
          docker compose --project-name "$project" --file compose.yaml --file compose.subpath.yaml config --quiet
          docker compose --project-name "$project" --file compose.yaml --file compose.subpath.yaml up --detach --no-build
          RINSPACE_SMOKE_ORIGIN="http://127.0.0.1:${RINSPACE_WEB_PORT}" RINSPACE_SMOKE_BASE_PATH=/rinspace-demo/ node scripts/smoke-container.mjs
          docker compose --project-name "$project" --file compose.yaml --file compose.subpath.yaml restart rinspace-web
          RINSPACE_SMOKE_ORIGIN="http://127.0.0.1:${RINSPACE_WEB_PORT}" RINSPACE_SMOKE_BASE_PATH=/rinspace-demo/ node scripts/smoke-container.mjs
      - name: Remove subpath service and image
        if: always()
        env:
          DOCKER_DEFAULT_PLATFORM: ${{ matrix.platform }}
          RINSPACE_WEB_IMAGE: rinspace-web:ci-${{ github.run_id }}-${{ matrix.architecture }}
          RINSPACE_WEB_PORT: ${{ matrix.port }}
        run: |
          project="rinspace-web-subpath-${GITHUB_RUN_ID}-${{ matrix.architecture }}"
          docker compose --project-name "$project" --file compose.yaml --file compose.subpath.yaml down --volumes --remove-orphans
          docker image rm "$RINSPACE_WEB_IMAGE" >/dev/null 2>&1 || true

  pull-published-image:
    name: Export published image
    if: github.event_name == 'workflow_dispatch' && inputs.operation == 'pull-published-image'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    steps:
      - name: Validate exact digest
        env:
          IMAGE_DIGEST: ${{ inputs.image_digest }}
        run: '[[ "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]'
      - name: Log in to GHCR
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull and verify exact published image
        env:
          IMAGE_DIGEST: ${{ inputs.image_digest }}
          EXPECTED_REVISION: c8c90a366fcff8e82cee621158b94b69118152d8
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}@${IMAGE_DIGEST}"
          docker pull "$image"
          test "$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "$image")" = "$EXPECTED_REVISION"
          docker image inspect --format 'pulled={{.Id}} revision={{index .Config.Labels "org.opencontainers.image.revision"}}' "$image"
          docker save --output "$RUNNER_TEMP/rinspace-web-v0.1.5.oci.tar" "$image"
          sha256sum "$RUNNER_TEMP/rinspace-web-v0.1.5.oci.tar" > "$RUNNER_TEMP/rinspace-web-v0.1.5.oci.tar.sha256"
      - name: Upload exact published image
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rinspace-web-v0.1.5-oci
          path: |
            ${{ runner.temp }}/rinspace-web-v0.1.5.oci.tar
            ${{ runner.temp }}/rinspace-web-v0.1.5.oci.tar.sha256
          if-no-files-found: error
          retention-days: 1
