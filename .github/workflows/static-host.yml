name: Static Host Preview

"on":
  pull_request:
    paths:
      - ".github/workflows/static-host.yml"
      - "config/**"
      - "docs/static-hosting-netlify*"
      - "netlify.toml"
      - "package.json"
      - "pnpm-lock.yaml"
      - "public/**"
      - "scripts/**"
      - "src/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/static-host.yml"
      - "config/**"
      - "docs/static-hosting-netlify*"
      - "netlify.toml"
      - "package.json"
      - "pnpm-lock.yaml"
      - "public/**"
      - "scripts/**"
      - "src/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: static-host-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preview:
    name: Netlify root and subpath artifacts
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, x64, rinspace-release-build]
    timeout-minutes: 45
    steps:
      - name: Checkout exact source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install pinned pnpm
        uses: pnpm/action-setup@7088e561eb65bb68695d245aa206f005ef30921d # v4.1.0
        with:
          version: 9.7.0
          run_install: false
      - name: Install pinned Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.22.3
          cache: pnpm
      - name: Install frozen dependencies and Chromium
        run: |
          pnpm install --frozen-lockfile
          pnpm exec playwright install chromium
      - name: Build one runtime-neutral core
        env:
          GENERATE_SOURCEMAP: "false"
          RINSPACE_BUILD_COMMIT: ${{ github.sha }}
          RINSPACE_BUILD_TIME: "1970-01-01T00:00:00.000Z"
        run: pnpm build
      - name: Prepare Netlify root and nested layouts without rebuilding core
        run: |
          RINSPACE_STATIC_CONFIG=config/runtime.demo.json RINSPACE_STATIC_OUTPUT=netlify-root pnpm prepare:netlify
          RINSPACE_STATIC_CONFIG=config/runtime.demo.subpath.json RINSPACE_STATIC_OUTPUT=netlify-subpath pnpm prepare:netlify
          pnpm test:static-host
          pnpm check:vite-artifact -- --core build --package netlify-root
          pnpm check:vite-artifact -- --core build --package netlify-subpath/rinspace-demo
          pnpm check:release-budgets -- --core build --package netlify-root
      - name: Validate root and subpath BrowserRouter refresh
        run: |
          RINSPACE_ARTIFACT_DIR=netlify-root pnpm exec playwright test tests/e2e/static-package.spec.ts --project=desktop-light --workers=1
          RINSPACE_ARTIFACT_DIR=netlify-subpath/rinspace-demo RINSPACE_PREVIEW_BASE_PATH=/rinspace-demo/ pnpm exec playwright test tests/e2e/static-package.spec.ts --project=desktop-light --workers=1
      - name: Upload controlled preview layouts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: netlify-layouts-${{ github.sha }}
          path: |
            netlify-root/
            netlify-subpath/
          if-no-files-found: error
          retention-days: 7
