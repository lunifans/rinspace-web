name: Release

"on":
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing annotated or lightweight vX.Y.Z tag to release
        required: true
        type: string

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  NODE_VERSION: 22.22.3
  PNPM_VERSION: 9.7.0

jobs:
  validate:
    name: Validate exact release source
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    outputs:
      commit: ${{ steps.metadata.outputs.commit }}
      created: ${{ steps.metadata.outputs.created }}
      epoch: ${{ steps.metadata.outputs.epoch }}
      tag: ${{ steps.metadata.outputs.tag }}
      version: ${{ steps.metadata.outputs.version }}
      world_contract_version: ${{ steps.metadata.outputs.world_contract_version }}
      world_shell_version: ${{ steps.metadata.outputs.world_shell_version }}
    steps:
      - name: Checkout release tag without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.tag || github.ref }}
      - name: Install pinned pnpm
        uses: pnpm/action-setup@7088e561eb65bb68695d245aa206f005ef30921d # v4.1.0
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false
      - name: Install pinned Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify legal and contribution policy readiness
        run: pnpm check:release-readiness
      - name: Verify tag, package version, and checked-out commit
        id: metadata
        env:
          REQUESTED_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          test "$(git rev-parse -q --verify "refs/tags/${REQUESTED_TAG}^{commit}")" = "$(git rev-parse HEAD)"
          version="$(node -p "JSON.parse(require('node:fs').readFileSync('package.json')).version")"
          test "$REQUESTED_TAG" = "v${version}"
          commit="$(git rev-parse HEAD)"
          epoch="$(git show -s --format=%ct HEAD)"
          created="$(git show -s --format=%cI HEAD)"
          world_contract_version="$(node -p "JSON.parse(require('node:fs').readFileSync('contracts/world-routes.json')).contractVersion")"
          world_shell_version="$(node -p "JSON.parse(require('node:fs').readFileSync('packages/world-shell/package.json')).version")"
          echo "tag=$REQUESTED_TAG" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "epoch=$epoch" >> "$GITHUB_OUTPUT"
          echo "created=$created" >> "$GITHUB_OUTPUT"
          echo "world_contract_version=$world_contract_version" >> "$GITHUB_OUTPUT"
          echo "world_shell_version=$world_shell_version" >> "$GITHUB_OUTPUT"
      - name: Run release source gates
        run: |
          pnpm check:publication-boundary
          pnpm check:dependencies -- --release
          pnpm check:env-boundary
          pnpm check:direct-fetch
          pnpm check:api-contract
          pnpm check:route-contracts
          pnpm test:route-contracts
          pnpm test:world-release
          pnpm test:release-shell
          pnpm test:dco
          pnpm check:dco
          pnpm check:demo-seed
          pnpm check:i18n
          pnpm check
          pnpm lint
          pnpm test -- --pool forks --maxWorkers 1
      - name: Build neutral core and root demo release shell
        env:
          GENERATE_SOURCEMAP: "false"
          RINSPACE_BUILD_COMMIT: ${{ steps.metadata.outputs.commit }}
          RINSPACE_BUILD_TIME: ${{ steps.metadata.outputs.created }}
          SOURCE_DATE_EPOCH: ${{ steps.metadata.outputs.epoch }}
        run: |
          pnpm build
          pnpm check:i18n:bundles
          pnpm package -- --config config/runtime.demo.json --out package-release --base-path /
          pnpm test:static-package
          pnpm check:vite-artifact -- --core build --package package-release
          pnpm check:release-budgets -- --core build --package package-release
      - name: Generate deterministic static archive, checksum, and SPDX SBOM
        env:
          RINSPACE_SOURCE_COMMIT: ${{ steps.metadata.outputs.commit }}
          SOURCE_DATE_EPOCH: ${{ steps.metadata.outputs.epoch }}
          VERSION: ${{ steps.metadata.outputs.version }}
        run: |
          mkdir -p release
          tar --sort=name --mtime="@${SOURCE_DATE_EPOCH}" --owner=0 --group=0 --numeric-owner -C package-release -cf - . | gzip -n > "release/rinspace-web-${VERSION}.tar.gz"
          pnpm generate:sbom -- --output "release/rinspace-web-${VERSION}.spdx.json"
          pnpm build:world-release -- --out world-release
          cp world-release/rinspace-world-shell-*.tgz release/
          cp world-release/rinspace-world-routes-*.json release/
          cp world-release/rinspace-world-release-*.spdx.json release/
          cp world-release/LICENSE-AGPL-3.0-only.txt world-release/license-info.json world-release/world-release-manifest.json release/
          cp world-release/SHA256SUMS release/WORLD-SHA256SUMS
          pnpm exec esbuild scripts/release-shell-cli.mjs --bundle --platform=node --format=esm --target=node22 --legal-comments=inline --outfile="release/rinspace-web-shell-${VERSION}.mjs"
          cp CHANGELOG.md "release/CHANGELOG-${VERSION}.md"
          cp package-release/version.json "release/version-${VERSION}.json"
          cd release
          sha256sum "rinspace-web-${VERSION}.tar.gz" "rinspace-web-${VERSION}.spdx.json" "rinspace-web-shell-${VERSION}.mjs" "version-${VERSION}.json" "CHANGELOG-${VERSION}.md" rinspace-world-* LICENSE-AGPL-3.0-only.txt license-info.json world-release-manifest.json WORLD-SHA256SUMS > SHA256SUMS
      - name: Upload immutable release inputs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-inputs-${{ steps.metadata.outputs.commit }}
          path: release/
          if-no-files-found: error
          retention-days: 14

  image:
    name: Publish signed multi-platform image input
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      image: ${{ steps.image.outputs.name }}
    steps:
      - name: Checkout exact release commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ needs.validate.outputs.commit }}
      - name: Set up pinned QEMU action
        uses: docker/setup-qemu-action@29109295f81e9208d7d86ff1c6c12d2833863392 # v3.6.0
        with:
          cache-image: false
      - name: Set up pinned Buildx action
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
        with:
          driver-opts: ${{ vars.RINSPACE_BUILDX_DRIVER_OPTS }}
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Record normalized image name
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
        run: echo "name=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - name: Build and push amd64/arm64 image by digest
        id: build
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.image.outputs.name }}:${{ needs.validate.outputs.version }}
          build-args: |
            RINSPACE_BUILD_COMMIT=${{ needs.validate.outputs.commit }}
            RINSPACE_BUILD_TIME=${{ needs.validate.outputs.created }}
          provenance: mode=max
          sbom: true
      - name: Save immutable image digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE: ${{ steps.image.outputs.name }}
        run: |
          test -n "$DIGEST"
          mkdir -p image
          printf '%s\n' "$DIGEST" > image/digest.txt
          printf '%s\n' "$IMAGE" > image/name.txt
      - name: Upload image identity
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: image-identity-${{ needs.validate.outputs.commit }}
          path: image/
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Attest, verify, and create immutable release
    needs:
      - validate
      - image
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      attestations: write
      contents: write
      id-token: write
      packages: read
    steps:
      - name: Checkout exact release commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ needs.validate.outputs.commit }}
      - name: Install pinned Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Download exact release inputs
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-inputs-${{ needs.validate.outputs.commit }}
          path: release
      - name: Download exact image identity
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: image-identity-${{ needs.validate.outputs.commit }}
          path: image
      - name: Verify checksums and immutable identities
        env:
          EXPECTED_COMMIT: ${{ needs.validate.outputs.commit }}
          EXPECTED_DIGEST: ${{ needs.image.outputs.digest }}
          EXPECTED_IMAGE: ${{ needs.image.outputs.image }}
          EXPECTED_TAG: ${{ needs.validate.outputs.tag }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_COMMIT"
          test "$(git rev-parse -q --verify "refs/tags/${EXPECTED_TAG}^{commit}")" = "$EXPECTED_COMMIT"
          test "$(cat image/digest.txt)" = "$EXPECTED_DIGEST"
          test "$(cat image/name.txt)" = "$EXPECTED_IMAGE"
          cd release
          sha256sum --check SHA256SUMS
      - name: Attest static archive provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: release/rinspace-web-${{ needs.validate.outputs.version }}.tar.gz
      - name: Attest SPDX SBOM provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: release/rinspace-web-${{ needs.validate.outputs.version }}.spdx.json
      - name: Attest official shell assembler provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: release/rinspace-web-shell-${{ needs.validate.outputs.version }}.mjs
      - name: Attest shared world shell provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: release/rinspace-world-shell-${{ needs.validate.outputs.world_shell_version }}.tgz
      - name: Attest world route contract provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: release/rinspace-world-routes-${{ needs.validate.outputs.world_contract_version }}.json
      - name: Verify GitHub attestations
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh attestation verify "release/rinspace-web-${{ needs.validate.outputs.version }}.tar.gz" --repo "$GITHUB_REPOSITORY"
          gh attestation verify "release/rinspace-web-${{ needs.validate.outputs.version }}.spdx.json" --repo "$GITHUB_REPOSITORY"
          gh attestation verify "release/rinspace-web-shell-${{ needs.validate.outputs.version }}.mjs" --repo "$GITHUB_REPOSITORY"
          gh attestation verify "release/rinspace-world-shell-${{ needs.validate.outputs.world_shell_version }}.tgz" --repo "$GITHUB_REPOSITORY"
          gh attestation verify "release/rinspace-world-routes-${{ needs.validate.outputs.world_contract_version }}.json" --repo "$GITHUB_REPOSITORY"
      - name: Log in to verify the immutable container digest
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify image digest and write release metadata
        env:
          DIGEST: ${{ needs.image.outputs.digest }}
          IMAGE: ${{ needs.image.outputs.image }}
          SOURCE_COMMIT: ${{ needs.validate.outputs.commit }}
          TAG: ${{ needs.validate.outputs.tag }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          docker buildx imagetools inspect "${IMAGE}@${DIGEST}"
          node scripts/write-release-metadata.mjs \
            --artifact "release/rinspace-web-${VERSION}.tar.gz" \
            --sbom "release/rinspace-web-${VERSION}.spdx.json" \
            --shell "release/rinspace-web-shell-${VERSION}.mjs" \
            --image "$IMAGE" \
            --image-digest "$DIGEST" \
            --commit "$SOURCE_COMMIT" \
            --tag "$TAG" \
            --api-contract-version v1 \
            --output "release/release-metadata-${VERSION}.json"
          cd release
          sha256sum "release-metadata-${VERSION}.json" >> SHA256SUMS
      - name: Create release from the verified source tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.validate.outputs.tag }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          gh release create "$TAG" --verify-tag --title "Rinspace Web ${TAG}" --notes-file "release/CHANGELOG-${VERSION}.md" release/*
