name: Private Release Rehearsal

"on":
  workflow_dispatch:
    inputs:
      candidate_tag:
        description: Exact existing candidate release tag (vX.Y.Z)
        required: true
        type: string
      candidate_commit:
        description: Exact lowercase 40-character candidate commit
        required: true
        type: string
      previous_tag:
        description: Exact previous release tag used for rollback
        required: true
        type: string
      release_run_id:
        description: Successful exact release workflow run
        required: true
        type: string
      ci_run_id:
        description: Successful exact public CI workflow run
        required: true
        type: string
      container_run_id:
        description: Successful exact container workflow run
        required: true
        type: string
      static_host_run_id:
        description: Successful exact static-host workflow run
        required: true
        type: string

permissions:
  actions: read
  attestations: read
  contents: read
  packages: read

concurrency:
  group: private-release-rehearsal-${{ inputs.candidate_commit }}
  cancel-in-progress: false

jobs:
  rehearse:
    if: github.repository == 'lunifans/rinspace-web' && github.event.repository.private == true
    environment: private-release-rehearsal
    runs-on: [self-hosted, linux, x64, rinspace-release-build]
    timeout-minutes: 120
    env:
      CI: "true"
      PLAYWRIGHT_WORKERS: "1"
      NODE_VERSION: 22.22.3
      PNPM_VERSION: 9.7.0
      CANDIDATE_TAG: ${{ inputs.candidate_tag }}
      CANDIDATE_COMMIT: ${{ inputs.candidate_commit }}
      PREVIOUS_TAG: ${{ inputs.previous_tag }}
      RELEASE_RUN_ID: ${{ inputs.release_run_id }}
      CI_RUN_ID: ${{ inputs.ci_run_id }}
      CONTAINER_RUN_ID: ${{ inputs.container_run_id }}
      STATIC_HOST_RUN_ID: ${{ inputs.static_host_run_id }}

    steps:
      - name: Validate immutable private rehearsal inputs
        run: |
          [[ "$CANDIDATE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$ ]]
          [[ "$PREVIOUS_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$ ]]
          test "$CANDIDATE_TAG" != "$PREVIOUS_TAG"
          [[ "$CANDIDATE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          for run_id in "$RELEASE_RUN_ID" "$CI_RUN_ID" "$CONTAINER_RUN_ID" "$STATIC_HOST_RUN_ID"; do
            [[ "$run_id" =~ ^[1-9][0-9]*$ ]]
          done
          test -x /etc/rinspace/bin/verify-rinspace-web-private-release

      - name: Fresh checkout of the exact candidate tag
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.candidate_tag }}

      - name: Install pinned pnpm
        uses: pnpm/action-setup@7088e561eb65bb68695d245aa206f005ef30921d # v4.1.0
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Install pinned Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Initialize bounded evidence and verify private source identity
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          evidence="$RUNNER_TEMP/rinspace-web-private-rehearsal-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir -p "$evidence/actions" "$evidence/release"
          echo "EVIDENCE_DIR=$evidence" >> "$GITHUB_ENV"
          test "$(git rev-parse HEAD)" = "$CANDIDATE_COMMIT"
          test "$(git rev-parse -q --verify "refs/tags/${CANDIDATE_TAG}^{commit}")" = "$CANDIDATE_COMMIT"
          test -z "$(git status --porcelain --untracked-files=no)"
          gh api "repos/$GITHUB_REPOSITORY" --jq '.private' | grep -qx true

      - name: Install frozen dependencies and all browsers
        run: |
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium firefox webkit

      - name: Run strict legal, source, dependency, and contract gates
        run: |
          pnpm check:release-readiness
          pnpm check:publication-boundary
          pnpm check:dependencies -- --release
          pnpm check:env-boundary
          pnpm check:direct-fetch
          pnpm check:api-contract
          pnpm check:route-contracts
          pnpm check:demo-seed
          pnpm check:i18n
          pnpm check:i18n:bundles
          pnpm check:readme
          pnpm check:release-budgets
          pnpm check:publication-ci
          pnpm test:cla
          pnpm check:cla-registry
          pnpm check
          pnpm lint

      - name: Reproduce README quick start from a clean copy
        run: pnpm verify:quick-start > "$EVIDENCE_DIR/quick-start.json"

      - name: Run unit coverage and deterministic runtime tests
        run: |
          pnpm test:coverage -- --pool forks --maxWorkers 1
          pnpm test:static-package
          pnpm test:static-host
          pnpm test:container-contract
          pnpm test:release-shell
          pnpm test:private-release-rehearsal

      - name: Build one candidate core and root/subpath packages
        env:
          GENERATE_SOURCEMAP: "false"
          RINSPACE_BUILD_COMMIT: ${{ inputs.candidate_commit }}
          RINSPACE_BUILD_TIME: "1970-01-01T00:00:00.000Z"
        run: |
          pnpm build
          pnpm package -- --config config/runtime.demo.json --out package-rehearsal-root --base-path /
          pnpm package -- --config config/runtime.demo.subpath.json --out package-rehearsal-subpath --base-path /rinspace-demo/
          pnpm check:vite-artifact -- --core build --package package-rehearsal-root
          pnpm check:vite-artifact -- --core build --package package-rehearsal-subpath

      - name: Validate guest/member routes, boundaries, and zero external requests in three browsers
        run: |
          pnpm test:demo-routes:browser > "$EVIDENCE_DIR/browser-routes.json"
          pnpm test:demo-production-boundaries:browser > "$EVIDENCE_DIR/browser-boundaries.json"

      - name: Validate packaged desktop/mobile, themes, reduced motion, and deep refresh
        run: |
          RINSPACE_ARTIFACT_DIR=package-rehearsal-root pnpm exec playwright test tests/e2e/static-package.spec.ts --workers=1
          RINSPACE_ARTIFACT_DIR=package-rehearsal-subpath RINSPACE_PREVIEW_BASE_PATH=/rinspace-demo/ pnpm exec playwright test tests/e2e/static-package.spec.ts --workers=1
          pnpm capture:demo-screenshots
          cp -R docs/assets/screenshots "$EVIDENCE_DIR/screenshots"

      - name: Verify exact successful workflow provenance and capture logs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { execFileSync } from 'node:child_process';
          const expected = [
            [process.env.RELEASE_RUN_ID, '.github/workflows/release.yml'],
            [process.env.CI_RUN_ID, '.github/workflows/ci.yml'],
            [process.env.CONTAINER_RUN_ID, '.github/workflows/container.yml'],
            [process.env.STATIC_HOST_RUN_ID, '.github/workflows/static-host.yml'],
          ];
          for (const [runId, workflowPath] of expected) {
            const body = execFileSync('gh', ['api', `repos/${process.env.GITHUB_REPOSITORY}/actions/runs/${runId}`], { encoding: 'utf8' });
            const run = JSON.parse(body);
            if (run.path !== workflowPath || run.head_sha !== process.env.CANDIDATE_COMMIT || run.conclusion !== 'success' || run.repository?.full_name !== process.env.GITHUB_REPOSITORY) {
              throw new Error(`Workflow run ${runId} does not match ${workflowPath} at the candidate commit.`);
            }
            fs.writeFileSync(`${process.env.EVIDENCE_DIR}/actions/${runId}.json`, `${JSON.stringify({ id: run.id, path: run.path, head_sha: run.head_sha, conclusion: run.conclusion }, null, 2)}\n`);
          }
          NODE
          for run_id in "$RELEASE_RUN_ID" "$CI_RUN_ID" "$CONTAINER_RUN_ID" "$STATIC_HOST_RUN_ID"; do
            gh run view "$run_id" --repo "$GITHUB_REPOSITORY" --log > "$EVIDENCE_DIR/actions/$run_id.log"
          done

      - name: Download and verify exact release attachments and attestations
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$CANDIDATE_TAG" --repo "$GITHUB_REPOSITORY" --dir "$EVIDENCE_DIR/release"
          cd "$EVIDENCE_DIR/release"
          sha256sum --check SHA256SUMS
          version="${CANDIDATE_TAG#v}"
          gh attestation verify "rinspace-web-${version}.tar.gz" --repo "$GITHUB_REPOSITORY"
          gh attestation verify "rinspace-web-${version}.spdx.json" --repo "$GITHUB_REPOSITORY"
          gh attestation verify "rinspace-web-shell-${version}.mjs" --repo "$GITHUB_REPOSITORY"

      - name: Run protected history, logs, layers, static-host, and rollback audit
        run: |
          /etc/rinspace/bin/verify-rinspace-web-private-release \
            --repository "$GITHUB_REPOSITORY" \
            --candidate-commit "$CANDIDATE_COMMIT" \
            --candidate-tag "$CANDIDATE_TAG" \
            --previous-tag "$PREVIOUS_TAG" \
            --source "$GITHUB_WORKSPACE" \
            --root-package "$GITHUB_WORKSPACE/package-rehearsal-root" \
            --subpath-package "$GITHUB_WORKSPACE/package-rehearsal-subpath" \
            --release-directory "$EVIDENCE_DIR/release" \
            --actions-directory "$EVIDENCE_DIR/actions" \
            --screenshots-directory "$EVIDENCE_DIR/screenshots" \
            --output "$EVIDENCE_DIR/private-release-rehearsal.json"
          pnpm check:private-release-rehearsal -- \
            --evidence "$EVIDENCE_DIR/private-release-rehearsal.json" \
            --commit "$CANDIDATE_COMMIT" \
            --tag "$CANDIDATE_TAG" \
            --previous-tag "$PREVIOUS_TAG"

      - name: Upload bounded private rehearsal evidence
        if: always() && env.EVIDENCE_DIR != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: private-release-rehearsal-${{ inputs.candidate_commit }}
          path: ${{ env.EVIDENCE_DIR }}/
          if-no-files-found: error
          retention-days: 90

      - name: Remove bounded rehearsal inputs
        if: always() && env.EVIDENCE_DIR != ''
        run: |
          if [[ "$EVIDENCE_DIR" != "$RUNNER_TEMP"/rinspace-web-private-rehearsal-* ]]; then
            echo 'Refusing cleanup outside the bounded rehearsal directory.' >&2
            exit 1
          fi
          rm -rf "$EVIDENCE_DIR"
