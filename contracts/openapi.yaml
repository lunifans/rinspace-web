{
  "openapi": "3.1.0",
  "info": {
    "title": "Rinspace Web Public API",
    "version": "1.0.0",
    "description": "The public compatibility contract consumed by the standalone Rinspace web frontend. It describes browser-visible API behavior, not private backend implementation."
  },
  "x-rinspace-contract-version": "v1",
  "servers": [{ "url": "/" }],
  "tags": [
    { "name": "bootstrap" },
    { "name": "identity" },
    { "name": "discovery" },
    { "name": "content" },
    { "name": "notifications" },
    { "name": "creation" },
    { "name": "integration" }
  ],
  "paths": {
    "/api/siteinfo": {
      "get": {
        "operationId": "getSiteInfo",
        "tags": ["bootstrap"],
        "x-rinspace-auth": "none",
        "responses": {
          "200": { "description": "Public site bootstrap information.", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/SiteInfo" } } } },
          "default": { "$ref": "#/components/responses/ApiError" }
        }
      }
    },
    "/api/feed": {
      "get": {
        "operationId": "getHomeFeed",
        "tags": ["discovery"],
        "x-rinspace-auth": "optional",
        "parameters": [
          { "name": "mode", "in": "query", "schema": { "type": "string", "enum": ["hot", "latest", "following", "unanswered"] } },
          { "name": "page", "in": "query", "schema": { "type": "integer", "minimum": 1 } },
          { "name": "size", "in": "query", "schema": { "type": "integer", "minimum": 1, "maximum": 100 } }
        ],
        "responses": {
          "200": { "description": "Home feed.", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/HomeFeed" } } } },
          "default": { "$ref": "#/components/responses/ApiError" }
        }
      }
    },
    "/api/home/sidebar": {
      "get": {
        "operationId": "getHomeSidebar",
        "tags": ["discovery"],
        "x-rinspace-auth": "optional",
        "parameters": [{ "name": "limit", "in": "query", "schema": { "type": "integer", "minimum": 1, "maximum": 100 } }],
        "responses": {
          "200": { "description": "Home sidebar.", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/HomeSidebar" } } } },
          "default": { "$ref": "#/components/responses/ApiError" }
        }
      }
    },
    "/api/content": {
      "get": {
        "operationId": "listContent",
        "tags": ["content"],
        "x-rinspace-auth": "optional",
        "parameters": [
          { "name": "type", "in": "query", "schema": { "$ref": "#/components/schemas/ContentType" } },
          { "name": "page", "in": "query", "schema": { "type": "integer", "minimum": 1 } },
          { "name": "size", "in": "query", "schema": { "type": "integer", "minimum": 1, "maximum": 100 } }
        ],
        "responses": {
          "200": { "description": "Content page.", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/ContentPage" } } } },
          "default": { "$ref": "#/components/responses/ApiError" }
        }
      },
      "post": {
        "operationId": "createContent",
        "tags": ["creation"],
        "x-rinspace-auth": "required",
        "requestBody": { "required": true, "content": { "application/json": { "schema": { "$ref": "#/components/schemas/CreateContentRequest" } } } },
        "responses": {
          "200": { "description": "Created content or moderation submission.", "content": { "application/json": { "schema": { "oneOf": [{ "$ref": "#/components/schemas/ContentDetail" }, { "$ref": "#/components/schemas/ModerationSubmission" }] } } } },
          "202": { "description": "Moderation submission accepted.", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/ModerationSubmission" } } } },
          "default": { "$ref": "#/components/responses/ApiError" }
        }
      }
    },
    "/api/content/{slug}": {
      "parameters": [{ "name": "slug", "in": "path", "required": true, "schema": { "type": "string", "minLength": 1 } }],
      "get": {
        "operationId": "getContentDetail",
        "tags": ["content"],
        "x-rinspace-auth": "optional",
        "responses": {
          "200": { "description": "Content detail.", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/ContentDetail" } } } },
          "default": { "$ref": "#/components/responses/ApiError" }
        }
      },
      "put": {
        "operationId": "updateContent",
        "tags": ["creation"],
        "x-rinspace-auth": "required",
        "requestBody": { "required": true, "content": { "application/json": { "schema": { "$ref": "#/components/schemas/CreateContentRequest" } } } },
        "responses": {
          "200": { "description": "Updated content.", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/ContentDetail" } } } },
          "default": { "$ref": "#/components/responses/ApiError" }
        }
      },
      "delete": {
        "operationId": "deleteContent",
        "tags": ["creation"],
        "x-rinspace-auth": "required",
        "responses": {
          "204": { "description": "Content deleted." },
          "default": { "$ref": "#/components/responses/ApiError" }
        }
      }
    },
    "/api/questions/{slug}": {
      "get": {
        "operationId": "getQuestionDetail",
        "tags": ["content"],
        "x-rinspace-auth": "optional",
        "parameters": [{ "name": "slug", "in": "path", "required": true, "schema": { "type": "string" } }],
        "responses": {
          "200": { "description": "Question detail.", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/QuestionDetail" } } } },
          "default": { "$ref": "#/components/responses/ApiError" }
        }
      }
    },
    "/api/search": {
      "get": {
        "operationId": "searchContent",
        "tags": ["discovery"],
        "x-rinspace-auth": "none",
        "parameters": [
          { "name": "q", "in": "query", "required": true, "schema": { "type": "string", "minLength": 1 } },
          { "name": "type", "in": "query", "schema": { "$ref": "#/components/schemas/SearchType" } },
          { "name": "order", "in": "query", "schema": { "$ref": "#/components/schemas/SearchOrder" } },
          { "name": "page", "in": "query", "schema": { "type": "integer", "minimum": 1 } },
          { "name": "size", "in": "query", "schema": { "type": "integer", "minimum": 1, "maximum": 100 } }
        ],
        "responses": {
          "200": { "description": "Search results.", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/SearchResponse" } } } },
          "default": { "$ref": "#/components/responses/ApiError" }
        }
      }
    },
    "/api/user/info": {
      "get": {
        "operationId": "getCurrentUserInfo",
        "tags": ["identity"],
        "x-rinspace-auth": "optional",
        "responses": {
          "200": { "description": "Current user or null for an anonymous request.", "content": { "application/json": { "schema": { "anyOf": [{ "$ref": "#/components/schemas/CurrentUserInfo" }, { "type": "null" }] } } } },
          "default": { "$ref": "#/components/responses/ApiError" }
        }
      },
      "put": {
        "operationId": "updateCurrentUserInfo",
        "tags": ["identity"],
        "x-rinspace-auth": "required",
        "requestBody": { "required": true, "content": { "application/json": { "schema": { "$ref": "#/components/schemas/CurrentUserInfoUpdate" } } } },
        "responses": {
          "200": { "description": "Updated current user.", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/CurrentUserInfo" } } } },
          "default": { "$ref": "#/components/responses/ApiError" }
        }
      }
    },
    "/api/profile": {
      "get": {
        "operationId": "getProfile",
        "tags": ["identity"],
        "x-rinspace-auth": "required",
        "responses": {
          "200": { "description": "Private profile preferences.", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/Profile" } } } },
          "204": { "description": "No profile exists." },
          "404": { "description": "No profile exists.", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/ErrorResponse" } } } },
          "default": { "$ref": "#/components/responses/ApiError" }
        }
      },
      "post": {
        "operationId": "saveProfile",
        "tags": ["identity"],
        "x-rinspace-auth": "required",
        "requestBody": { "required": true, "content": { "application/json": { "schema": { "$ref": "#/components/schemas/Profile" } } } },
        "responses": {
          "200": { "description": "Saved profile.", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/Profile" } } } },
          "default": { "$ref": "#/components/responses/ApiError" }
        }
      }
    },
    "/api/notifications": {
      "get": {
        "operationId": "listNotifications",
        "tags": ["notifications"],
        "x-rinspace-auth": "required",
        "responses": {
          "200": { "description": "Notification list.", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/NotificationListResponse" } } } },
          "default": { "$ref": "#/components/responses/ApiError" }
        }
      }
    },
    "/api/notifications/{notificationId}/read": {
      "put": {
        "operationId": "markNotificationRead",
        "tags": ["notifications"],
        "x-rinspace-auth": "required",
        "parameters": [{ "name": "notificationId", "in": "path", "required": true, "schema": { "type": "integer" } }],
        "responses": {
          "200": { "description": "Updated notification.", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/NotificationItem" } } } },
          "204": { "description": "Notification marked read." },
          "default": { "$ref": "#/components/responses/ApiError" }
        }
      }
    },
    "/api/notifications/read-all": {
      "put": {
        "operationId": "markAllNotificationsRead",
        "tags": ["notifications"],
        "x-rinspace-auth": "required",
        "requestBody": { "content": { "application/json": { "schema": { "type": "object", "properties": { "type": { "type": "string" } }, "additionalProperties": false } } } },
        "responses": {
          "204": { "description": "Notifications marked read." },
          "default": { "$ref": "#/components/responses/ApiError" }
        }
      }
    },
    "/api/question": {
      "post": {
        "operationId": "createQuestion",
        "tags": ["creation"],
        "x-rinspace-auth": "required",
        "requestBody": { "required": true, "content": { "application/json": { "schema": { "$ref": "#/components/schemas/CreateQuestionRequest" } } } },
        "responses": {
          "200": { "description": "Question created.", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/QuestionWriteResult" } } } },
          "202": { "description": "Question accepted for moderation.", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/ModerationSubmission" } } } },
          "default": { "$ref": "#/components/responses/ApiError" }
        }
      }
    },
    "/api/discussions": {
      "post": {
        "operationId": "createDiscussion",
        "tags": ["creation"],
        "x-rinspace-auth": "required",
        "requestBody": { "required": true, "content": { "application/json": { "schema": { "$ref": "#/components/schemas/CreateContentRequest" } } } },
        "responses": {
          "200": { "description": "Discussion created.", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/ContentDetail" } } } },
          "default": { "$ref": "#/components/responses/ApiError" }
        }
      }
    },
    "/api/statuses": {
      "post": {
        "operationId": "createStatus",
        "tags": ["creation"],
        "x-rinspace-auth": "required",
        "requestBody": { "required": true, "content": { "application/json": { "schema": { "$ref": "#/components/schemas/CreateContentRequest" } } } },
        "responses": {
          "200": { "description": "Status created.", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/ContentDetail" } } } },
          "default": { "$ref": "#/components/responses/ApiError" }
        }
      }
    },
    "/api/rin-writer/draft": {
      "parameters": [
        { "name": "key", "in": "query", "required": true, "schema": { "type": "string", "minLength": 1, "maxLength": 512 } }
      ],
      "get": {
        "operationId": "getWriterDraft",
        "tags": ["creation"],
        "x-rinspace-auth": "required",
        "responses": {
          "200": { "description": "Current autosave draft.", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/WriterDraftEnvelope" } } } },
          "204": { "description": "No autosave draft exists." },
          "default": { "$ref": "#/components/responses/ApiError" }
        }
      },
      "put": {
        "operationId": "saveWriterDraft",
        "tags": ["creation"],
        "x-rinspace-auth": "required",
        "requestBody": { "required": true, "content": { "application/json": { "schema": { "$ref": "#/components/schemas/WriterDraftWriteRequest" } } } },
        "responses": {
          "200": { "description": "Autosave draft stored.", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/WriterDraftEnvelope" } } } },
          "default": { "$ref": "#/components/responses/ApiError" }
        }
      },
      "delete": {
        "operationId": "deleteWriterDraft",
        "tags": ["creation"],
        "x-rinspace-auth": "required",
        "responses": {
          "204": { "description": "Autosave draft removed." },
          "default": { "$ref": "#/components/responses/ApiError" }
        }
      }
    },
    "/api/creator/analytics": {
      "get": {
        "operationId": "getCreatorAnalytics",
        "tags": ["creation"],
        "x-rinspace-auth": "required",
        "parameters": [
          { "name": "granularity", "in": "query", "required": true, "schema": { "type": "string", "enum": ["week", "month", "year"] } },
          { "name": "period", "in": "query", "required": true, "schema": { "type": "string", "minLength": 1 } }
        ],
        "responses": {
          "200": { "description": "Creator analytics for a selected period.", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/CreatorAnalytics" } } } },
          "default": { "$ref": "#/components/responses/ApiError" }
        }
      }
    },
    "/api/gitea/sso": {
      "post": {
        "operationId": "syncGiteaSession",
        "tags": ["integration"],
        "x-rinspace-auth": "required",
        "responses": {
          "204": { "description": "Gitea session synchronized." },
          "default": { "$ref": "#/components/responses/ApiError" }
        }
      },
      "delete": {
        "operationId": "clearGiteaSession",
        "tags": ["integration"],
        "x-rinspace-auth": "none",
        "responses": {
          "204": { "description": "Gitea session cleared." },
          "default": { "$ref": "#/components/responses/ApiError" }
        }
      }
    }
  },
  "components": {
    "responses": {
      "ApiError": {
        "description": "Unified API failure.",
        "content": { "application/json": { "schema": { "$ref": "#/components/schemas/ErrorResponse" } } }
      }
    },
    "schemas": {
      "CapabilityName": {
        "type": "string",
        "enum": ["content.read", "content.interact", "content.create", "demo.reset", "upload.local", "renderer.remote", "workspace.remote"]
      },
      "Capabilities": {
        "type": "object",
        "required": ["contractVersion", "roles", "capabilities"],
        "properties": {
          "contractVersion": { "type": "string", "enum": ["v1"] },
          "roles": { "type": "array", "items": { "type": "string" } },
          "capabilities": { "type": "array", "items": { "$ref": "#/components/schemas/CapabilityName" } }
        },
        "additionalProperties": false
      },
      "ErrorDetail": {
        "type": "object",
        "required": ["code", "message"],
        "properties": {
          "code": { "type": "string" },
          "message": { "type": "string" },
          "correlationId": { "type": "string" },
          "details": { "type": "object", "additionalProperties": true }
        },
        "additionalProperties": false
      },
      "ErrorResponse": {
        "oneOf": [
          { "$ref": "#/components/schemas/ErrorDetail" },
          {
            "type": "object",
            "required": ["error"],
            "properties": { "error": { "$ref": "#/components/schemas/ErrorDetail" } },
            "additionalProperties": false
          }
        ]
      },
      "SiteInfo": {
        "type": "object",
        "required": ["general", "interface", "version", "revision"],
        "properties": {
          "general": { "type": "object", "required": ["name", "short_description", "description", "site_url", "contact_email"], "properties": { "name": { "type": "string" }, "short_description": { "type": "string" }, "description": { "type": "string" }, "site_url": { "type": "string" }, "contact_email": { "type": "string" } }, "additionalProperties": true },
          "interface": { "type": "object", "required": ["language", "time_zone"], "properties": { "language": { "type": "string" }, "time_zone": { "type": "string" } }, "additionalProperties": true },
          "version": { "type": "string" },
          "revision": { "type": "string" }
        },
        "additionalProperties": true
      },
      "ContentType": { "type": "string", "enum": ["blog", "question", "discussion", "announcement", "dynamic", "book", "forum", "status", "task", "tag"] },
      "ContentSummary": {
        "type": "object",
        "required": ["id", "type", "title", "author"],
        "properties": {
          "id": { "type": "string" },
          "type": { "$ref": "#/components/schemas/ContentType" },
          "title": { "type": "string" },
          "author": { "type": "string" },
          "excerpt": { "type": "string" },
          "tags": { "type": "array", "items": { "type": "string" } },
          "createdAt": { "type": "string" },
          "updatedAt": { "type": "string" }
        },
        "additionalProperties": true
      },
      "ContentDetail": {
        "allOf": [
          { "$ref": "#/components/schemas/ContentSummary" },
          { "type": "object", "required": ["slug", "body", "readCount", "collected", "createdAt", "updatedAt"], "properties": { "slug": { "type": "string" }, "body": { "type": "string" }, "readCount": { "type": "integer" }, "collected": { "type": "boolean" }, "createdAt": { "type": "string" }, "updatedAt": { "type": "string" } }, "additionalProperties": true }
        ]
      },
      "ContentPage": {
        "type": "object",
        "required": ["items", "count", "page", "pageSize", "generatedAt"],
        "properties": {
          "items": { "type": "array", "items": { "$ref": "#/components/schemas/ContentSummary" } },
          "count": { "type": "integer" },
          "page": { "type": "integer" },
          "pageSize": { "type": "integer" },
          "generatedAt": { "type": "string" }
        },
        "additionalProperties": false
      },
      "HomeFeed": {
        "type": "object",
        "required": ["featuredBlog", "stream", "questionHotlist", "community", "announcements", "tasks", "followedTags", "generatedAt"],
        "properties": {
          "featuredBlog": { "$ref": "#/components/schemas/ContentSummary" },
          "stream": { "type": "array", "items": { "$ref": "#/components/schemas/ContentSummary" } },
          "questionHotlist": { "type": "array", "items": { "$ref": "#/components/schemas/ContentSummary" } },
          "community": { "type": "array", "items": { "$ref": "#/components/schemas/ContentSummary" } },
          "announcements": { "type": "array", "items": { "$ref": "#/components/schemas/ContentSummary" } },
          "tasks": { "type": "array", "items": { "$ref": "#/components/schemas/ContentSummary" } },
          "followedTags": { "type": "array", "items": { "type": "string" } },
          "generatedAt": { "type": "string" }
        },
        "additionalProperties": false
      },
      "HomeSidebar": {
        "type": "object",
        "required": ["metrics", "hotDiscussions", "recommendedUsers", "source", "generatedAt"],
        "properties": {
          "metrics": { "type": "object", "required": ["todayReads", "todayNewFans"], "properties": { "todayReads": { "type": "integer" }, "todayNewFans": { "type": "integer" } }, "additionalProperties": false },
          "hotDiscussions": { "type": "array", "items": { "$ref": "#/components/schemas/ContentSummary" } },
          "recommendedUsers": { "type": "array", "items": { "type": "object", "additionalProperties": true } },
          "source": { "type": "string" },
          "generatedAt": { "type": "string" }
        },
        "additionalProperties": false
      },
      "QuestionDetail": { "type": "object", "required": ["question", "answers"], "properties": { "question": { "type": "object", "additionalProperties": true }, "answers": { "type": "array", "items": { "type": "object", "additionalProperties": true } } }, "additionalProperties": true },
      "SearchType": { "type": "string", "enum": ["all", "question", "answer", "tag", "user", "post", "blog", "book", "discussion", "dynamic", "forum", "status"] },
      "SearchOrder": { "type": "string", "enum": ["newest", "active", "score", "relevance"] },
      "SearchResult": {
        "type": "object",
        "required": ["objectType", "id", "title", "excerpt", "author", "voteCount", "createdAt", "updatedAt"],
        "properties": {
          "objectType": { "type": "string" }, "id": { "type": "string" }, "slug": { "type": "string" }, "userId": { "type": "string" },
          "title": { "type": "string" }, "excerpt": { "type": "string" }, "author": { "type": "string" }, "avatarUrl": { "type": "string" },
          "tags": { "type": "array", "items": { "type": "string" } }, "voteCount": { "type": "number" }, "answerCount": { "type": "number" },
          "createdAt": { "type": "string" }, "updatedAt": { "type": "string" }
        },
        "additionalProperties": false
      },
      "SearchResponse": { "type": "object", "required": ["count", "items"], "properties": { "count": { "type": "integer" }, "items": { "type": "array", "items": { "$ref": "#/components/schemas/SearchResult" } } }, "additionalProperties": false },
      "AvatarInfo": { "type": "object", "required": ["type", "gravatar", "custom"], "properties": { "type": { "type": "string" }, "gravatar": { "type": "string" }, "custom": { "type": "string" } }, "additionalProperties": false },
      "AvatarInfoUpdate": { "type": "object", "properties": { "type": { "type": "string" }, "gravatar": { "type": "string" }, "custom": { "type": "string" } }, "additionalProperties": false },
      "CurrentUserInfo": {
        "type": "object",
        "required": ["id", "created_at", "last_login_date", "username", "display_name", "avatar", "cover_url", "mobile", "bio", "bio_html", "website", "location", "about_html", "language", "color_scheme", "access_token", "role_id", "role_name", "rank", "status", "have_password", "visit_token", "suspended_until"],
        "properties": {
          "id": { "type": "string" }, "created_at": { "type": "number" }, "last_login_date": { "type": "number" }, "username": { "type": "string" }, "display_name": { "type": "string" },
          "avatar": { "$ref": "#/components/schemas/AvatarInfo" }, "cover_url": { "type": "string" }, "mobile": { "type": "string" }, "bio": { "type": "string" }, "bio_html": { "type": "string" },
          "website": { "type": "string" }, "location": { "type": "string" }, "about_html": { "type": "string" }, "language": { "type": "string" }, "color_scheme": { "type": "string" },
          "access_token": { "type": "string" }, "role_id": { "type": "integer" }, "role_name": { "type": "string", "enum": ["member", "moderator", "admin"] }, "rank": { "type": "number" },
          "status": { "type": "string" }, "have_password": { "type": "boolean" }, "visit_token": { "type": "string" }, "suspended_until": { "type": "number" }
        },
        "additionalProperties": false
      },
      "CurrentUserInfoUpdate": {
        "type": "object",
        "properties": {
          "display_name": { "type": "string" }, "username": { "type": "string" }, "avatar": { "$ref": "#/components/schemas/AvatarInfoUpdate" }, "cover_url": { "type": "string" },
          "bio": { "type": "string" }, "website": { "type": "string" }, "location": { "type": "string" }, "about_html": { "type": "string" }
        },
        "additionalProperties": false
      },
      "Profile": {
        "type": "object",
        "properties": {
          "uid": { "type": "string" }, "handle": { "type": "string" }, "username": { "type": "string" }, "nickname": { "type": "string" }, "rank": { "type": "integer" }, "avatarDataUrl": { "type": "string" }, "coverUrl": { "type": "string" },
