services:
  rinspace-web:
    build:
      context: .
      args:
        RINSPACE_BUILD_COMMIT: ${RINSPACE_BUILD_COMMIT:-0000000000000000000000000000000000000000}
        RINSPACE_BUILD_TIME: ${RINSPACE_BUILD_TIME:-1970-01-01T00:00:00.000Z}
    image: ${RINSPACE_WEB_IMAGE:-rinspace-web:local}
    user: "1000:1000"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /run/rinspace:rw,noexec,nosuid,nodev,uid=1000,gid=1000,mode=0750
    environment:
      PORT: "8080"
      RINSPACE_PUBLIC_API_BASE_URL: /api/
      RINSPACE_PUBLIC_BASE_PATH: /
      RINSPACE_PUBLIC_CANONICAL_ORIGIN: http://localhost:8080
      RINSPACE_PUBLIC_CLOUDBASE_ENV_ID: ${RINSPACE_PUBLIC_CLOUDBASE_ENV_ID:-}
      RINSPACE_PUBLIC_CLOUDBASE_PUBLISHABLE_KEY: ${RINSPACE_PUBLIC_CLOUDBASE_PUBLISHABLE_KEY:-}
      RINSPACE_PUBLIC_CLOUDBASE_REGION: ${RINSPACE_PUBLIC_CLOUDBASE_REGION:-}
      RINSPACE_PUBLIC_GITEA_BASE_URL: ${RINSPACE_PUBLIC_GITEA_BASE_URL:-}
      RINSPACE_PUBLIC_RUNTIME_CONFIG_JSON: ${RINSPACE_PUBLIC_RUNTIME_CONFIG_JSON:-}
    ports:
      - "127.0.0.1:${RINSPACE_WEB_PORT:-8080}:8080"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:8080/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    restart: unless-stopped
